{% extends 'base.html' %}

{% block title %}Password Changed - SmartBiz AI{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-50 to-orange-50 py-12 px-4">
    <div class="card max-w-md w-full text-center">
        <i class="fas fa-circle-check text-green-600 text-4xl"></i>
        <h1 class="mt-4 text-2xl font-bold text-teal-900">Password changed</h1>
        <p class="mt-3 text-gray-600">Your password has been updated successfully.</p>
        <a href="{% url 'accounts:login' %}" class="inline-block mt-6 btn-primary">Sign in</a>
    </div>
</div>
{% endblock %}
