{% extends 'base.html' %}

{% block title %}Check Your Email - SmartBiz AI{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-50 to-orange-50 py-12 px-4">
    <div class="card max-w-md w-full text-center">
        <i class="fas fa-envelope-open-text text-teal-600 text-4xl"></i>
        <h1 class="mt-4 text-2xl font-bold text-teal-900">Check your email</h1>
        <p class="mt-3 text-gray-600">If an account exists for that email, password reset instructions have been sent.</p>
        <a href="{% url 'accounts:login' %}" class="inline-block mt-6 btn-primary">Return to login</a>
    </div>
</div>
{% endblock %}
