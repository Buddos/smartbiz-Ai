{% extends 'layouts/app.html' %}
{% block page %}
<div class="flex justify-between mb-4"><h1 class="text-2xl font-bold text-primary-700">{{ title }}</h1><a class="btn-primary" href="{% url 'products:category_create' %}">Add category</a></div>
<div class="card">{% for c in categories %}<p class="py-2 border-b">{{ c.name }}</p>{% empty %}<p class="text-gray-500">No categories.</p>{% endfor %}</div>
{% endblock %}
