{% extends 'base.html' %}
{% block title %}{{ title }} - SmartBiz AI{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 py-6">
    {% if request.GET.from != 'admin' %}
      <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 text-sm text-primary-600 hover:text-primary-800 mb-5">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        <span>Back to Dashboard</span>
      </a>
    {% endif %}
    {% block page %}{% endblock %}
  </div>
</div>
{% endblock %}
