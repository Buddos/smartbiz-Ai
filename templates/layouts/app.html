{% extends 'base.html' %}
{% block title %}{{ title }} - SmartBiz AI{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <a href="{% if request.GET.from == 'admin' %}{% url 'business_admin' %}{% else %}{% url 'dashboard' %}{% endif %}" class="inline-flex items-center gap-2 text-sm text-primary-600 hover:text-primary-800 mb-5">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      <span>{% if request.GET.from == 'admin' %}Back to Administration{% else %}Back to Dashboard{% endif %}</span>
    </a>
    {% block page %}{% endblock %}
  </div>
</div>
{% endblock %}
