{% extends 'base.html' %}

{% block title %}Welcome to SmartBiz AI{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4">
    <div class="max-w-2xl mx-auto text-center">
        <div class="card">
            <div class="mx-auto h-14 w-14 rounded-2xl bg-primary-500 flex items-center justify-center">
                <i class="fas fa-bolt text-white text-2xl"></i>
            </div>
            <h1 class="mt-5 text-2xl font-bold text-primary-700">Welcome to SmartBiz AI</h1>
            <p class="mt-3 text-gray-600">You can explore your account now and set up your business whenever you are ready.</p>
            <div class="mt-6 flex flex-col sm:flex-row justify-center gap-3">
                <a href="{% url 'businesses:setup' %}" class="btn-primary"><i class="fas fa-rocket mr-2"></i>Set up my business</a>
                <a href="{% url 'accounts:profile' %}" class="btn-outline"><i class="fas fa-user mr-2"></i>View my profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
