{% extends 'layouts/app.html' %}
{% block page %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold text-primary-700">{{ title }}</h1>
  <a href="{% url 'customers:create' %}" class="btn-primary">Add customer</a>
</div>
<form method="get" class="card mb-4"><input class="input-field" name="search" value="{{ search }}" placeholder="Search customers"></form>
<div class="card overflow-x-auto">
  <table class="w-full text-sm">
    <thead><tr class="text-left text-gray-500"><th class="py-2">Name</th><th>Phone</th><th>Orders</th><th>Spent</th></tr></thead>
    <tbody>
      {% for c in page_obj %}
      <tr class="border-t"><td class="py-2"><a class="text-primary-700" href="{% url 'customers:detail' c.id %}">{{ c.name }}</a></td><td>{{ c.phone }}</td><td>{{ c.order_count }}</td><td>KSh {{ c.total_spent|default:0 }}</td></tr>
      {% empty %}<tr><td colspan="4" class="py-6 text-gray-500">No customers yet.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
