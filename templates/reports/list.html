{% extends 'layouts/app.html' %}
{% block page %}
<div class="mb-4">
  <h1 class="text-2xl font-bold text-primary-700">{{ title }}</h1>
</div>
<form class="card mb-4 flex flex-wrap items-end gap-4" method="get" action="{% url 'reports:generate' %}">
  <input type="hidden" name="type" value="PERFORMANCE">
  <label class="flex flex-col gap-1" for="report-start">
    <span class="font-medium">From</span>
    <input class="input-field" id="report-start" type="date" name="start" value="{{ start|date:'Y-m-d' }}" required>
  </label>
  <label class="flex flex-col gap-1" for="report-end">
    <span class="font-medium">To</span>
    <input class="input-field" id="report-end" type="date" name="end" value="{{ end|date:'Y-m-d' }}" required>
  </label>
  <button class="btn-primary" type="submit">Generate performance report</button>
</form>
<div class="card">
  {% for r in reports %}
  <p class="py-2 border-b"><a class="text-primary-700" href="{% url 'reports:detail' r.id %}{% if request.GET.from == 'admin' %}?from=admin{% endif %}">{{ r.title }}</a></p>
  {% empty %}<p class="text-gray-500">No reports yet.</p>{% endfor %}
</div>
{% endblock %}
